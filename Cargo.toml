[workspace]
resolver        = "3"
members         = [ "crates/*", "xtask" ]
default-members = [ "crates/watt" ]

[workspace.package]
description  = "Modern CPU frequency and power management utility for Linux"
edition      = "2024"
license      = "MPL-2.0"
readme       = true
repository   = "https://github.com/notashelf/watt"
rust-version = "1.95"
version      = "1.4.0"

[workspace.dependencies]
# Workspace components
watt          = { path = "./crates/watt", version = "1.4.0" }
watt-config   = { path = "./crates/config", version = "1.4.0" }
watt-platform = { path = "./crates/platform", version = "1.4.0" }

# Other dependencies
caress          = "0.3.0"
dbus            = { features = [ "futures", "vendored" ], version = "0.9.12" }
dbus-crossroads = "0.5.3"
dbus-tokio      = "0.7.6"
env_logger      = "0.11.11"
futures-channel = "0.3.34"
futures-util    = "0.3.33"
humantime       = "2.4.0"
jiff            = "0.2.35"
log             = "0.4.33"
misstep         = "0.4.1"
nix             = { features = [ "fs" ], version = "0.31.3" }
num_cpus        = "1.17.0"
pound           = "0.6.1"
schemars        = "1.2.2"
serde           = { features = [ "derive" ], version = "1.0.229" }
serde_json      = "1.0.151"
tempfile        = "3.27.0"
tiny_http       = "0.12.0"
tokio           = { features = [ "macros", "rt-multi-thread", "signal", "sync", "time" ], version = "1.53.1" }
toml            = "1.1.3"
yansi           = { features = [ "detect-env", "detect-tty" ], version = "1.0.1" }

[workspace.lints.clippy]
absolute_paths = "deny"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true
