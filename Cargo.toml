[workspace]
resolver        = "3"
members         = [ "watt", "xtask" ]
default-members = [ "watt" ]

[workspace.package]
description  = "Modern CPU frequency and power management utility for Linux"
edition      = "2024"                                                        # Keep in sync with .rustfmt.toml.
license      = "MPL-2.0"
readme       = true
repository   = "https://github.com/notashelf/watt"
rust-version = "1.88"
version      = "1.4.0"

[workspace.dependencies]
# Workspace components
watt = { path = "./watt", version = "1.4.0" }

# Other dependencies
anyhow                = "1.0.104"
clap                  = { features = [ "derive", "env" ], version = "4.6.2" }
clap-verbosity-flag   = "3.0.4"
clap_complete         = "4.6.8"
clap_complete_nushell = "4.6.1"
env_logger            = "0.11.11"
futures-util          = "0.3.33"
humantime             = "2.4.0"
jiff                  = "0.2.35"
log                   = "0.4.33"
nix                   = { features = [ "fs" ], version = "0.31.3" }
num_cpus              = "1.17.0"
serde                 = { features = [ "derive" ], version = "1.0.229" }
serde_json            = "1.0.151"
schemars              = "1.2.2"
tiny_http             = "0.12.0"
tokio                 = { features = [ "macros", "rt-multi-thread", "signal", "time" ], version = "1.53.1" }
toml                  = "1.1.3"
yansi                 = { features = [ "detect-env", "detect-tty" ], version = "1.0.1" }
zbus                  = { default-features = false, features = [ "tokio" ], version = "5.18.0" }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true
