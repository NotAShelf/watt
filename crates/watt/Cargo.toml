[package]
name                   = "watt"
description.workspace  = true
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[[bin]]
name = "watt"
path = "main.rs"

[dependencies]
caress.workspace              = true
dbus.workspace                = true
dbus-crossroads.workspace     = true
dbus-tokio.workspace          = true
futures-channel.workspace      = true
env_logger.workspace          = true
misstep.workspace             = true
pound.workspace               = true
futures-util.workspace        = true
log.workspace                 = true
nix.workspace                 = true
schemars.workspace            = true
serde.workspace               = true
serde_json.workspace          = true
tempfile.workspace            = true
tiny_http                     = { optional = true, workspace = true }
tokio.workspace               = true
toml.workspace                = true
watt-config.workspace         = true
watt-platform.workspace       = true
yansi.workspace               = true

[dev-dependencies]
watt-platform = { workspace = true, features = [ "test-support" ] }

[features]
default = [  ]
metrics = [ "dep:tiny_http", "watt-config/metrics" ]
